services:
  - type: web
    name: drivesafe
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'exec gunicorn --workers 1 --threads 4 --timeout 120 --bind "0.0.0.0:${PORT:-10000}" app:app'
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_PATH
        value: /tmp/drivesafe.db
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: EYE_CLOSED_THRESHOLD
        value: "0.22"
      - key: EYE_OPEN_THRESHOLD
        value: "0.26"
      - key: EYE_CLOSED_CONFIRM_FRAMES
        value: "2"
      - key: BLINK_MIN_DURATION
        value: "0.08"
      - key: BLINK_MAX_DURATION
        value: "0.80"
      - key: DROWSINESS_TIME
        value: "2.0"
